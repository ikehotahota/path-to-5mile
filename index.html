<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path to 5mile</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4FB; --ink:#2A2440; --sub:#8A83A5; --card:#FFFFFF;
  --violet:#7C6BC4; --violet-soft:#EDE9F9;
  --ums:#2E8B84; --ums-soft:#E2F1EF;
  --rkt:#E0704A; --rkt-soft:#FBEAE2;
  --win:#C9A227; --win-soft:#FBF3DA;
  --line:#E5E1F0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"M PLUS Rounded 1c",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:var(--violet);color:#fff;padding:18px 16px 14px;border-radius:0 0 20px 20px}
header h1{font-family:"Mochiy Pop One",sans-serif;font-size:20px;font-weight:400;letter-spacing:.03em}
header .sub{font-size:13px;opacity:.85;margin-top:2px}
.money{display:flex;gap:10px;margin-top:12px}
.stickybar{position:sticky;top:0;z-index:20;background:var(--violet);padding:8px 16px 10px;border-radius:0 0 16px 16px}
.stickybar .money{margin-top:0}
.money div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 8px;min-width:0}
.money .lbl{font-size:11px;opacity:.9}
.money .val{font-family:"Mochiy Pop One",sans-serif;font-size:17px;font-weight:400;margin-top:2px;white-space:nowrap}
nav{display:flex;gap:4px;padding:10px 16px 6px;position:sticky;top:74px;background:var(--bg);z-index:19}
nav button{flex:1;border:none;background:#fff;border:1.5px solid var(--line);color:var(--sub);font-family:inherit;font-weight:700;font-size:13px;padding:9px 1px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:10px 16px}
.hint{font-size:13px;color:var(--sub);margin:4px 2px 10px}
.tix{position:relative;background:var(--card);border-radius:14px;margin-bottom:12px;padding:12px 14px 12px 22px;box-shadow:0 1px 4px rgba(42,36,64,.07);overflow:hidden}
.tix::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--edge,var(--violet))}
.tix::after{content:"";position:absolute;left:4px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--bg);transform:translate(-50%,-50%)}
.tix.ums{--edge:var(--ums)} .tix.rkt{--edge:var(--rkt)}
.row1{display:flex;align-items:center;gap:8px}
.row1 .name{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:17px;flex:1}
.badge{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px}
.badge.ums{background:var(--ums-soft);color:var(--ums)}
.badge.rkt{background:var(--rkt-soft);color:var(--rkt)}
.period{font-size:16px;font-weight:700;color:#5A5378;margin-top:3px}
.heldat{font-size:15px;color:var(--sub);margin-top:2px}
.applybtn{width:100%;margin-top:10px;font-family:inherit;font-size:16px;font-weight:700;padding:9px 0;border-radius:10px;border:1.5px dashed var(--violet);background:#fff;color:var(--violet);cursor:pointer}
.applybtn.on{border-style:solid;background:var(--violet-soft)}
.counts{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:9px}
.counts .cap{font-size:15px;font-weight:700;color:var(--sub);margin-bottom:5px}
.crow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.crow .ed{font-size:17px;flex:1}
.crow .price{font-size:15px;color:var(--sub)}
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:42px;height:38px;border:none;background:#fff;font-size:22px;font-weight:700;color:var(--violet);cursor:pointer;font-family:inherit}
.step span{width:48px;text-align:center;font-size:20px;font-weight:900}
.amt{text-align:right;font-size:18px;font-weight:900;margin-top:4px}
.amt small{font-weight:500;color:var(--sub);font-size:14px;margin-right:4px}
.winbox{margin-top:10px;background:var(--win-soft);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.winbox .wl{flex:1;font-size:16px;font-weight:700;color:#8a6d0d}
.winbox .step button{color:#8a6d0d}
.winbtn{flex:2;font-family:"Mochiy Pop One",sans-serif;font-size:19px;font-weight:400;padding:12px 0;border-radius:12px;border:2px solid var(--win);background:var(--win-soft);color:#8a6d0d;cursor:pointer}
.btnrow{display:flex;gap:8px;margin-top:10px}
.losebtn{flex:1;font-family:inherit;font-size:16px;font-weight:700;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
.losebtn:active{transform:scale(.97)}
.losebox{margin-top:10px;background:#F1F0F5;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:8px}
.losebox .ll{flex:1;font-size:16px;font-weight:700;color:var(--sub)}
.losebox button{font-family:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:6px 12px;cursor:pointer}
.winbtn:active{transform:scale(.97)}
.day{display:flex;gap:10px;margin-bottom:10px;align-items:stretch}
.day .date{width:72px;flex-shrink:0;text-align:center;background:#fff;border-radius:12px;padding:8px 0;border:1.5px solid var(--line)}
.day .date .d{font-size:18px;font-weight:900}
.day .date .w{font-size:13px;color:var(--sub)}
.day .body{flex:1;background:#fff;border-radius:12px;padding:9px 12px;border-left:5px solid var(--edge,var(--violet))}
.day.ums .body{--edge:var(--ums)} .day.rkt .body{--edge:var(--rkt)} .day.mile .body{--edge:var(--win)}
.day .t{font-size:16px;font-weight:700}
.day .cd{font-size:13px;color:var(--sub);margin-top:1px}
.day .cd b{color:var(--rkt)}
.day.done{opacity:.45}
.day.done .t{text-decoration:line-through}
.sumcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(42,36,64,.07)}
.sumcard h3{font-size:16px;margin-bottom:8px}
.srow{display:flex;justify-content:space-between;font-size:16px;padding:5px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}
.srow b{font-weight:900}
.prices input{width:96px;font-family:inherit;font-size:16px;font-weight:700;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:right}
.octo{text-align:center;font-size:14px;color:var(--sub);margin:18px 0 6px}
.reset{display:block;margin:10px auto 0;background:none;border:none;color:var(--sub);font-size:13px;font-family:inherit;text-decoration:underline;cursor:pointer}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:9px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.loading{text-align:center;padding:50px 0;color:var(--sub);font-size:16px}
</style>
</head>
<body>
<header style="padding-bottom:8px;border-radius:0">
  <h1>🐙 Path to 5mile</h1>
  <div class="sub">OCTPATH 3rd album イベント計算表</div>
</header>
<div class="stickybar">
  <div class="money">
    <div><div class="lbl">予定(未購入)</div><div class="val" id="mPlan">—</div></div>
    <div><div class="lbl">確定(購入済)</div><div class="val" id="mConf">—</div></div>
    <div><div class="lbl">見込み総額</div><div class="val" id="mTotal">—</div></div>
  </div>
</div>
<nav>
  <button id="tab0" class="on">申込</button>
  <button id="tab1">予定表</button>
  <button id="tab2">集計</button>
  <button id="tab3">当日</button>
  <button id="tab4">リンク</button>
  <button id="tab5">使い方</button>
</nav>
<main id="main"><div class="loading">読み込み中…🐙</div></main>
<div class="toast" id="toast"></div>
<script>
const KEY="5mile-ledger-v1";
const store={
  async get(k){
    if(window.storage){return await window.storage.get(k);}
    try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch(e){return null;}
  },
  async set(k,v){
    if(window.storage){return await window.storage.set(k,v);}
    try{localStorage.setItem(k,v);return {ok:1};}catch(e){return null;}
  }
};
const EDITIONS=[["f","フラッシュ盤"],["i","初回限定盤"],["c","FC盤"]];
const RESULTS={
  sign1:{d:"2026-09-11",t:"9/11(金)15:00以降"},
  sign2:{d:"2026-09-19",t:"9/19(土)15:00以降"},
  cardsign:{d:"2026-09-15",t:"9/15(火)15:00以降"},
  gs1:{d:"2026-09-29",t:"9/29(火)15:00以降"},
  gs2:{d:"2026-10-07",t:"10/7(水)15:00以降"},
  gs3:{d:"2026-10-15",t:"10/15(木)15:00以降"},
  bs1:{d:"2026-10-23",t:"10/23(金)15:00以降"},
  bs2:{d:"2026-11-02",t:"11/2(月)15:00以降"},
  xmas1:{d:"2026-09-18",t:"9/18(金)夕方頃"},
  xmas2:{d:"2026-09-30",t:"9/30(水)夕方頃"},
  papa:{d:"2026-10-09",t:"10/9(金)夕方頃"},
  aku1:{d:"2026-10-19",t:"10/19(月)夕方頃"},
  aku2:{d:"2026-10-28",t:"10/28(水)夕方頃"}
};
const TARGETS={
  online:["f"],sign1:["f"],sign2:["f"],cardsign:["c"],
  gs1:["i"],gs2:["i"],gs3:["i"],bs1:["f"],bs2:["f"],
  aku1:["f","i"],aku2:["f","i"],papa:["f","i"],xmas1:["f","i"],xmas2:["f","i"]
};
const TNOTES={
  online:"対象:フラッシュ盤(専用ページ) 1枚=1口",
  sign1:"対象:フラッシュ盤2枚セット=1口",
  sign2:"対象:フラッシュ盤2枚セット=1口",
  cardsign:"対象:FC限定盤 1セット=1口",
  gs1:"対象:初回限定盤(FC専用ページ)",
  gs2:"対象:初回限定盤(FC専用ページ)",
  gs3:"対象:初回限定盤(FC専用ページ)",
  bs1:"対象:フラッシュ盤(FC会員限定・1枚=1口)",
  bs2:"対象:フラッシュ盤(FC会員限定・1枚=1口)",
  aku1:"対象:フラッシュ盤 or 初回限定盤(1枚=1口・クレカ限定)",
  aku2:"対象:フラッシュ盤 or 初回限定盤(1枚=1口・クレカ限定)",
  xmas1:"対象:フラッシュ盤 or 初回限定盤(楽天・クレカ限定)",
  xmas2:"対象:フラッシュ盤 or 初回限定盤(楽天・クレカ限定)",
  papa:"対象:フラッシュ盤 or 初回限定盤(1枚=1口・当選は1人1回)"
};
function editionsFor(ev){
  const t=TARGETS[ev.id];
  return EDITIONS.filter(([k])=>{
    if(ev.plan[k]||ev.conf[k])return true;      // 入力済みは常に表示
    if(t)return t.includes(k);                   // 対象盤が判明→それだけ
    if(k==="c"&&!state.prices.c)return false;    // FC盤は単価未設定なら隠す
    return true;
  });
}
const DEFAULT={
  prices:{f:2420,i:6050,c:6980},
  events:[
    {id:"online",name:"個別オンライン",part:"ー",period:"申込終了※購入した人は記録してね(当選口も)",deadline:null,win:"",applied:false,wins:0,eventDate:"2026-11-01",plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"sign1",name:"個別サイン会",part:"1部",period:"9/3-9/5",deadline:"2026-09-05",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"cardsign",name:"カードサイン会",part:"ー",period:"8/31-9/7",deadline:"2026-09-07",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"sign2",name:"個別サイン会",part:"2部",period:"9/11-9/13",deadline:"2026-09-13",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"xmas1",name:"クリスマスカード会",part:"1部",period:"9/11-9/13",deadline:"2026-09-13",win:"rkt",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"gs1",name:"プレミアムグループサイン会",part:"1部",period:"9/19-9/21",deadline:"2026-09-21",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"xmas2",name:"クリスマスカード会",part:"2部",period:"9/18-9/23",deadline:"2026-09-23",win:"rkt",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"gs2",name:"プレミアムグループサイン会",part:"2部",period:"9/29-10/1",deadline:"2026-10-01",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"papa",name:"パパラッチ会",part:"ー",period:"9/30-10/4",deadline:"2026-10-04",win:"rkt",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"gs3",name:"プレミアムグループサイン会",part:"3部",period:"10/7-10/9",deadline:"2026-10-09",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"aku1",name:"個別握手会",part:"1部",period:"10/9-10/12",deadline:"2026-10-12",win:"rkt",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"bs1",name:"Best Shot会",part:"1部",period:"10/15-10/17",deadline:"2026-10-17",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"aku2",name:"個別握手会",part:"2部",period:"10/19-10/21",deadline:"2026-10-21",win:"rkt",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}},
    {id:"bs2",name:"Best Shot会",part:"2部",period:"10/23-10/25",deadline:"2026-10-25",win:"ums",applied:false,wins:0,plan:{f:0,i:0,c:0},conf:{f:0,i:0,c:0}}
  ]
};
const NOTICE={date:"2026-12-18",label:"📩 参加通知ご案内予定(12/26イベント分)"};
const MILES=[
  {date:"2026-10-23",label:"💻 個別オンライン参加券 受取開始 18:00〜"},
  {date:"2026-10-31",label:"💻 個別オンライン参加券 受取期限 23:59まで"},
  {date:"2026-11-13",label:"📩 カードサイン会 参加通知ご案内予定 15:00以降"},
  {date:"2026-11-18",label:"💿『5mile』発売日"},
  {date:"2026-11-19",label:"🎂 5周年ライブ＆カードサイン会＠立川"},
  {date:"2026-12-26",label:"🗣️ 発売記念イベント＠TOC有明"}
];
let state=null,tab=0;
const yen=n=>"¥"+n.toLocaleString("ja-JP");
const UNITS={sign1:{f:2},sign2:{f:2}};  // 1口あたりの枚数(2枚セット等)
const unitOf=(ev,k)=>(UNITS[ev.id]&&UNITS[ev.id][k])||1;
const amountEv=(ev,cnt)=>["f","i","c"].reduce((s,k)=>s+cnt[k]*(state.prices[k]||0)*unitOf(ev,k),0);
const sheetsEv=(ev,cnt)=>["f","i","c"].reduce((s,k)=>s+cnt[k]*unitOf(ev,k),0);

async function load(){
  try{
    const r=await store.get(KEY);
    if(r&&r.value){state=JSON.parse(r.value);}
  }catch(e){/* first run */}
  if(!state){state=JSON.parse(JSON.stringify(DEFAULT));tab=5;}
  // migrate from old status-based format
  state.events.forEach(e=>{
    if(e.applied===undefined)e.applied=(e.status==="applied"||e.status==="won"||e.status==="lost");
    if(e.wins===undefined)e.wins=(e.status==="won"?1:0);
    delete e.status;
  });
  DEFAULT.events.forEach((de,i)=>{
    if(!state.events.find(e=>e.id===de.id)){
      state.events.splice(Math.min(i,state.events.length),0,JSON.parse(JSON.stringify(de)));
    }
  });
  state.events.forEach(e=>{if(e.name==="グループサイン会")e.name="プレミアムグループサイン会";});
  const on=state.events.find(e=>e.id==="online");
  if(on&&!on.eventDate)on.eventDate="2026-11-01";
  if(on)on.period="申込終了※購入した人は記録してね(当選口も)";
  if(!state.prices.c)state.prices.c=6980;
  render();
}
let saveTimer=null,warned=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const r=await store.set(KEY,JSON.stringify(state));
      if(!r)warnOnce();
    }catch(e){warnOnce();}
  },400);
}
function warnOnce(){
  if(warned)return;warned=true;
  toast("この画面では自動保存が効かないみたい。集計タブのバックアップを使ってね🐙");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}
function header(){
  let plan=0,conf=0;
  state.events.forEach(e=>{
    if(e.applied)conf+=amountEv(e,e.conf);
    else plan+=amountEv(e,e.plan);
  });
  document.getElementById("mPlan").textContent=yen(plan);
  document.getElementById("mConf").textContent=yen(conf);
  document.getElementById("mTotal").textContent=yen(plan+conf);
}
function stepper(val,cb){
  const w=document.createElement("div");w.className="step";
  const m=document.createElement("button");m.textContent="−";m.setAttribute("aria-label","減らす");
  const s=document.createElement("span");s.textContent=val;
  const p=document.createElement("button");p.textContent="＋";p.setAttribute("aria-label","増やす");
  m.onclick=()=>cb(-1);p.onclick=()=>cb(1);
  w.append(m,s,p);return w;
}
function renderList(root){
  const hint=document.createElement("p");hint.className="hint";
  hint.textContent="①予定で予算計算 → ②買ったら「応募・購入した」→ ③当たったら当選カウントUP🎉";
  root.appendChild(hint);
  state.events.forEach(ev=>{
    const c=document.createElement("div");c.className="tix "+(ev.win||"");
    const r1=document.createElement("div");r1.className="row1";
    const nm=document.createElement("div");nm.className="name";
    nm.textContent=ev.name+(ev.part&&ev.part!=="ー"?"["+ev.part+"]":"")+(ev.wins>0?" 🎉".repeat(Math.min(ev.wins,3)):"");
    r1.appendChild(nm);
    if(ev.win){
      const b=document.createElement("span");b.className="badge "+ev.win;
      b.textContent=ev.win==="ums"?"ユニバ":"楽天";r1.appendChild(b);
    }
    c.appendChild(r1);
    const pd=document.createElement("div");pd.className="period";
    pd.textContent=ev.deadline?("申込 "+ev.period+"(23:59まで)"):ev.period;
    c.appendChild(pd);
    if(RESULTS[ev.id]){
      const rd=document.createElement("div");rd.className="heldat";
      rd.textContent="🎲 当落通知 "+RESULTS[ev.id].t;
      c.appendChild(rd);
    }
    if(ev.id==="cardsign"){
      const ha=document.createElement("div");ha.className="heldat";
      ha.textContent="開催 11/19(木) 立川ステージガーデン ※5周年ライブ終演後";
      c.appendChild(ha);
    }
    if(ev.custom){
      const ed=document.createElement("div");ed.className="heldat";
      ed.style.cssText="display:flex;align-items:center;gap:6px;flex-wrap:wrap";
      const ni=document.createElement("input");ni.type="text";ni.value=ev.name;ni.placeholder="イベント名";
      ni.style.cssText="flex:1;min-width:130px;font-family:inherit;font-size:15px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px";
      ni.onchange=()=>{ev.name=ni.value||"新イベント";save();render();};
      const di=document.createElement("input");di.type="date";di.value=ev.deadline||"";
      di.style.cssText="font-family:inherit;font-size:15px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px";
      di.onchange=()=>{ev.deadline=di.value||null;save();render();};
      const del=document.createElement("button");del.textContent="✕";
      del.style.cssText="font-family:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:4px 10px";
      del.onclick=()=>{
        if(!del.dataset.arm){del.dataset.arm="1";del.textContent="削除?";del.style.color="var(--rkt)";del.style.borderColor="var(--rkt)";

function renderSchedule(root){
  const hint=document.createElement("p");hint.className="hint";
  hint.textContent="締切順。済んだものは自動でうすくなるよ";
  root.appendChild(hint);
  const today=new Date();today.setHours(0,0,0,0);
  const items=state.events.filter(e=>e.deadline).map(e=>({
    date:e.deadline,label:e.name+(e.part!=="ー"?"["+e.part+"]":"")+" 申込締切",
    cls:e.win,done:e.applied||new Date(e.deadline)<today,
    applied:e.applied,wins:e.wins,lost:e.lost
  })).concat(MILES.map(m=>({date:m.date,label:m.label,cls:"mile",done:new Date(m.date)<today})))
  .concat(state.events.filter(e=>e.id==="online"&&e.eventDate).map(e=>({date:e.eventDate,label:"💻 個別オンライン 開催日",cls:"",done:new Date(e.eventDate)<today})))
  .concat(state.events.filter(e=>e.applied&&RESULTS[e.id]).map(e=>({date:RESULTS[e.id].d,label:"🎲 "+e.name+(e.part!=="ー"?"["+e.part+"]":"")+" 当落発表",cls:"",done:new Date(RESULTS[e.id].d)<today||e.wins>0||e.lost,wins:e.wins,lost:e.lost})))
  .concat(state.events.some(e=>e.wins>0&&RESULTS[e.id]&&e.id!=="cardsign")?[{date:NOTICE.date,label:NOTICE.label,cls:"mile",done:new Date(NOTICE.date)<today}]:[]);
  items.sort((a,b)=>a.date<b.date?-1:1);
  items.forEach(it=>{
    const d=new Date(it.date+"T00:00:00");
    const diff=Math.round((d-today)/86400000);
    const el=document.createElement("div");el.className="day "+it.cls+(it.done&&!it.wins?" done":"");
    const dt=document.createElement("div");dt.className="date";
    dt.innerHTML='<div class="d">'+(d.getMonth()+1)+"/"+d.getDate()+'</div><div class="w">'+["日","月","火","水","木","金","土"][d.getDay()]+"</div>";
    const bd=document.createElement("div");bd.className="body";
    const t=document.createElement("div");t.className="t";t.textContent=it.label;
    const cd=document.createElement("div");cd.className="cd";
    if(it.wins>0)cd.textContent="当選"+it.wins+"口🎉";
    else if(it.lost)cd.textContent="残念…おつかれさま😢";
    else if(it.applied)cd.textContent="応募済・結果待ち";
    else if(diff<0)cd.textContent="終了";
    else if(diff===0)cd.innerHTML="<b>今日23:59まで!</b>";
    else if(diff<=3)cd.innerHTML="<b>あと"+diff+"日</b>";
    else cd.textContent="あと"+diff+"日";
    bd.append(t,cd);el.append(dt,bd);root.appendChild(el);
  });
}
function renderSummary(root){
  let plan=0,conf=0,planN=0,confN=0,wins=0,applied=0,lost=0,waiting=0;
  const byWin={ums:0,rkt:0,other:0};
  const planBy={f:0,i:0,c:0},confBy={f:0,i:0,c:0};
  state.events.forEach(e=>{
    if(!e.applied){
      plan+=amountEv(e,e.plan);
      planN+=sheetsEv(e,e.plan);
      ["f","i","c"].forEach(k=>planBy[k]+=e.plan[k]*unitOf(e,k));
    }
    if(e.applied){
      conf+=amountEv(e,e.conf);
      confN+=sheetsEv(e,e.conf);
      ["f","i","c"].forEach(k=>confBy[k]+=e.conf[k]*unitOf(e,k));
      applied++;
      byWin[e.win||"other"]+=amountEv(e,e.conf);
    }
    wins+=e.wins;
    if(e.applied){if(e.lost)lost++;else if(e.wins===0)waiting++;}
  });
  const s1=document.createElement("div");s1.className="sumcard";
  s1.innerHTML="<h3>💰 お金の集計</h3>"
    +'<div class="srow"><span>予定金額(未購入の計画分)</span><b>'+yen(plan)+"</b></div>"
    +'<div class="srow"><span>購入金額(確定)</span><b>'+yen(conf)+"</b></div>"
    +'<div class="srow"><span>見込み総額(確定＋予定)</span><b>'+yen(plan+conf)+"</b></div>"
    +'<div class="srow"><span>枚数(予定 / 購入)</span><b></b></div>'

    +'<div class="srow"><span>　FC限定盤</span><b>'+planBy.c+"枚 / "+confBy.c+"枚</b></div>"
    +'<div class="srow"><span>　合計</span><b>'+planN+"枚 / "+confN+"枚</b></div>";
  const s2=document.createElement("div");s2.className="sumcard";
  s2.innerHTML="<h3>🎯 応募の状況</h3>"
    +'<div class="srow"><span>応募・購入済み</span><b>'+applied+"件</b></div>"
    +'<div class="srow"><span>当選口数の合計🎉</span><b>'+wins+"口</b></div>"
    +'<div class="srow"><span>結果待ち / 残念</span><b>'+waiting+"件 / "+lost+"件</b></div>"
    +'<div class="srow"><span>ユニバ購入額</span><b>'+yen(byWin.ums)+"</b></div>"
    +'<div class="srow"><span>楽天購入額</span><b>'+yen(byWin.rkt)+"</b></div>";
  const s3=document.createElement("div");s3.className="sumcard prices";
  s3.innerHTML="<h3>🏷️ 単価設定(税込)</h3>";
  EDITIONS.forEach(([k,label])=>{
    const row=document.createElement("div");row.className="srow";
    const sp=document.createElement("span");sp.textContent=label+(k==="c"?"(未定なら0)":"");
    const inp=document.createElement("input");inp.type="number";inp.min="0";inp.value=state.prices[k]||0;
    inp.onchange=()=>{state.prices[k]=Math.max(0,Number(inp.value)||0);save();render();};
    row.append(sp,inp);s3.appendChild(row);
  });
  root.append(s1,s2,s3);
  const s4=document.createElement("div");s4.className="sumcard";
  s4.innerHTML="<h3>💾 バックアップ</h3><p style='font-size:13px;color:var(--sub);margin-bottom:8px'>自動保存が効かないときはここからデータを退避してね。「書き出す」→全文コピーしてメモに保存。復元は貼り付けて「読み込む」</p>";
  const ta=document.createElement("textarea");
  ta.style.cssText="width:100%;height:90px;font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-family:monospace";
  ta.placeholder="ここに書き出し/貼り付け";
  const btnrow=document.createElement("div");btnrow.style.cssText="display:flex;gap:8px;margin-top:8px";
  const ex=document.createElement("button");
  ex.style.cssText="flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:9px 0;border-radius:10px;border:1.5px solid var(--violet);background:var(--violet-soft);color:var(--violet)";
  ex.textContent="書き出す";
  ex.onclick=()=>{
    ta.value=JSON.stringify(state);
    ta.select();ta.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("コピーしたよ!メモに貼って保存してね");}

  };
  const im=document.createElement("button");

  btnrow.append(ex,im);s4.append(ta,btnrow);root.appendChild(s4);

    try{await store.set(KEY,JSON.stringify(state));}catch(e){}
    render();toast("まっさらにしたよ🐙");
  };
  root.appendChild(rs);
}

  sign2:"参加通知画面(スクショ不可)/顔写真付き身分証/当選数分のフラッシュ盤CDジャケット",
  bs1:"参加通知画面/顔写真付き身分証/FC会員証(WEB版マイページ・アプリ不可)/撮影用スマホ",
  bs2:"参加通知画面/顔写真付き身分証/FC会員証(WEB版マイページ・アプリ不可)/撮影用スマホ",
  gs1:"参加通知画面/顔写真付き身分証/FC会員証(WEB版)",
  gs2:"参加通知画面/顔写真付き身分証/FC会員証(WEB版)",
  gs3:"参加通知画面/顔写真付き身分証/FC会員証(WEB版)",
  aku1:"当選QRコード(スクショ・印刷不可)/顔写真付き身分証",
  aku2:"当選QRコード(スクショ・印刷不可)/顔写真付き身分証",
  xmas1:"当選QRコード(スクショ・印刷不可)/顔写真付き身分証",
  xmas2:"当選QRコード(スクショ・印刷不可)/顔写真付き身分証",
  papa:"当選QRコード(スクショ・印刷不可)/顔写真付き身分証",
  cardsign:"参加通知/顔写真付き身分証/FC会員証(WEB版)",
  online:"受け取った参加券(10/23 18:00〜10/31 23:59に要受取!)"
};
function renderDay(root){
  const won=state.events.filter(e=>e.wins>0);
  if(won.length===0){
    const p=document.createElement("div");p.className="sumcard";
    p.innerHTML="<h3>🎫 当選したイベント</h3><p style='font-size:15px;color:var(--sub)'>まだ当選の記録がないよ🐙<br>申込タブで「当選！🎉」を押すと、ここに当日のスケジュールが並ぶよ</p>";
    root.appendChild(p);return;
  }
  const hint=document.createElement("p");hint.className="hint";
  hint.textContent="当選したイベントだけを日付・時間順に並べたよ。当日はこの画面を見ながら動いてね";
  root.appendChild(hint);
  const byDate={};
  won.forEach(e=>{
    const info=DAYINFO[e.id];if(!info)return;
    (byDate[info.d]=byDate[info.d]||[]).push({e,info});
  });
  Object.keys(byDate).sort().forEach(d=>{
    const dt=new Date(d+"T00:00:00");
    const card=document.createElement("div");card.className="sumcard";
    card.innerHTML="<h3>📅 "+(dt.getMonth()+1)+"/"+dt.getDate()+"("+["日","月","火","水","木","金","土"][dt.getDay()]+") "+byDate[d][0].info.v+"</h3>";
    const rows=[];
    byDate[d].forEach(({e,info})=>{
      if(e.id==="online"&&e.parts){
        ONLINE_PARTS.forEach(([pn,ptm,prec])=>{
          if(e.parts[pn])rows.push({e,label:"個別オンライン["+pn+"] ×"+e.parts[pn]+"口🎉",time:ptm+" ("+prec+")",sort:ptm});
        });
      }else{
        rows.push({e,label:e.name+(e.part!=="ー"?"["+e.part+"]":"")+" ×"+e.wins+"口🎉",time:info.t,sort:info.t});
      }
    });
    rows.sort((a,b)=>(a.sort>b.sort?1:-1)).forEach(({e,label,time})=>{
      const row=document.createElement("div");
      row.style.cssText="padding:10px 0;border-bottom:1px solid var(--line)";
      const nm=document.createElement("div");
      nm.style.cssText="font-size:17px;font-weight:900";
      nm.textContent=label;
      const tm=document.createElement("div");
      tm.style.cssText="font-size:16px;font-weight:700;color:var(--violet);margin-top:2px";
      tm.textContent="⏰ "+time;
      row.append(nm,tm);
      if(BRING[e.id]){
        const br=document.createElement("div");
        br.style.cssText="font-size:14px;color:var(--sub);margin-top:4px";
        br.textContent="🎒 "+BRING[e.id];
        row.appendChild(br);
      }
      card.appendChild(row);
    });
    card.lastChild.style.borderBottom="none";
    root.appendChild(card);
  });
  const memo=document.createElement("div");memo.className="sumcard";
  memo.innerHTML="<h3>📝 共通の持ち物メモ</h3><div style='font-size:15px;line-height:1.8'>・顔写真付きの本人確認書類(原本)<br>・参加通知/QRコードを表示できるスマホ(通信できる状態で)<br>・複数当選は部ごとに受付が必要。早めに動こう<br>・荷物は肩にかけられる1点まで(キャリー不可)</div>";
  root.appendChild(memo);
}
function renderHelp(root){
  const warn=document.createElement("div");
  warn.className="sumcard";
  warn.style.cssText="border:2px solid var(--rkt);background:var(--rkt-soft)";
  warn.innerHTML="<h3 style='font-size:17px'>⚠️ さいしょに読んでね</h3>"
   +"<div style='font-size:15px;line-height:1.9'>"
   +"<b>🔒 入力した記録は自分のスマホの中だけに保存されます。</b>誰かに共有されたり、作った人に見られたりすることは一切ありません。安心して使ってね。<br><br>"
   +"<b>📢 これは非公式のファンツールです。</b>日程や金額はチェックしていますが、間違いや変更が反映されていない可能性があります。<b>申込の前には必ず公式のお知らせをご確認ください。</b>このツールの情報による誤認・申込漏れなどについて責任は負いかねます。その点をご了承のうえご使用ください。<br><br>"
   +"<b>💾 記録が消えることがあります。</b>ブラウザの履歴やサイトデータを削除すると記録も消えます。大事な記録は「集計」タブの💾バックアップで書き出しておくと安心です。"
   +"</div>";
  root.appendChild(warn);

  const steps=[
    ["① 申込タブ：買う前に予算を計算","イベントごとに『購入予定』の＋−で口数を入れると金額が出ます。対象の盤は自動で切り替わるので、そのイベントで買えるものだけが表示されます。"],
    ["② 買ったら「応募・購入した！」","このボタンを押すと予定→確定に変わり、上の『購入金額』に反映されます。押し間違えたらもう一度タップ（2回押しで取消）。"],
    ["③ 当たったら「当選！🎉」","当落発表日より前に押すと確認が出ます。複数口当たったら＋−で口数を直せます。個別オンラインは1部〜10部それぞれで記録できます。"],
    ["④ 予定表タブ：締切と発表日","申込締切・当落発表日・発売日などが日付順に並びます。『あと◯日』が出るので、うっかり忘れ防止に。応募したイベントの当落発表日だけが表示されます。"],
    ["⑤ 集計タブ：合計を確認","予定・購入金額、盤ごとの枚数、当選口数、窓口別の金額が見られます。単価の変更もここから。"],
    ["⑥ 当日タブ：当選したものだけ","当選を記録すると、当日のスケジュールが日付・時間順に並びます。イベントごとの持ち物も出るので、当日はこの画面を見ながら動けます。"],
    ["⑦ リンクタブ：公式ページへ","各イベントの公式お知らせに飛べます。申込の詳細・最新情報は必ずこちらで。"]
  ];
  const card=document.createElement("div");card.className="sumcard";
  card.innerHTML="<h3>📖 使い方</h3>";
  steps.forEach(([t,d])=>{
    const b=document.createElement("div");
    b.style.cssText="padding:10px 0;border-bottom:1px solid var(--line)";
    b.innerHTML="<div style='font-size:16px;font-weight:900;margin-bottom:3px'>"+t+"</div>"
      +"<div style='font-size:15px;color:var(--sub);line-height:1.7'>"+d+"</div>";
    card.appendChild(b);
  });
  card.lastChild.style.borderBottom="none";
  root.appendChild(card);

  const tips=document.createElement("div");tips.className="sumcard";
  tips.innerHTML="<h3>💡 ちょっとしたコツ</h3><div style='font-size:15px;line-height:1.9'>"
   +"・ホーム画面に追加するとアプリのように開けます（共有ボタン→ホーム画面に追加）<br>"
   +"・リリイベなど新しいイベントは、申込タブ下の『＋イベントを追加』から自分で足せます<br>"
   +"・個別サイン会は2枚セットで1口なので、数字は『口数』を入れてください<br>"
   +"・結果が出たら『当選！🎉』か『残念😢』を押すと記録が残ります（あとから取消もできます）🍀"
   +"</div>";
  root.appendChild(tips);
}
function render(){
  header();
  ["tab0","tab1","tab2","tab3","tab4","tab5"].forEach((id,i)=>document.getElementById(id).classList.toggle("on",tab===i));
  const m=document.getElementById("main");m.innerHTML="";
  if(tab===0)renderList(m);
  if(tab===1)renderSchedule(m);
  if(tab===2)renderSummary(m);
  if(tab===3)renderDay(m);
  if(tab===4)renderLinks(m);
  if(tab===5)renderHelp(m);
  const oc=document.createElement("div");oc.className="octo";oc.textContent="🐙 記録は自動保存されるよ";
  m.appendChild(oc);
}
["tab0","tab1","tab2","tab3","tab4","tab5"].forEach((id,i)=>document.getElementById(id).onclick=()=>{tab=i;render();});
load();
</script>
